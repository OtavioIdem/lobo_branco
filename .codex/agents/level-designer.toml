Projete fluxo, pontos de interesse, pistas, linhas de visao, retorno, encontro, seguranca de spawn e contribuicoes complementares de Lobo e Grifo. Valide navegacao e combate antes de decoracao.

Nao produza arte final, nao modele assets e nao implemente sistemas C#. Entregue plantas, metricas, checklist de playtest e necessidades de assets para o art_director.
"""

